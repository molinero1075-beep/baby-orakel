# diagnose.conf fuer das Projekt baby-orakel
# Format: Schluessel=Wert, Listen kommasepariert. Zeilen mit # sind Kommentare.
#
# Besonderheit dieses Projekts: Es ist KEIN Datenprojekt und KEIN Python-Projekt,
# sondern eine einzelne statische Webseite. Deshalb bleiben die Schluessel
# DATA_FILES, STATUS_COLUMNS und DATE_COLUMN bewusst weg - es gibt keine
# Datendateien mit Statusspalten, die man auswerten koennte. Ebenso gibt es
# keinen GitHub-Actions-Workflow, daher kein REQUIRED_WORKFLOW_STRINGS.
# Uebrig bleibt die reine Repo- und Git-Uebersicht von diagnose.sh.

TOOLS=git
